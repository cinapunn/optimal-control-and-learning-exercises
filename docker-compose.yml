version: '3.8'

services:
  optimal-control:
    build: .
    platform: linux/arm64
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ACADOS_SOURCE_DIR=/acados
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' 